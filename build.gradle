plugins {
	id 'org.springframework.boot' version '3.4.5'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.graalvm.buildtools.native' version '0.10.6'
	id 'java'
	id 'eclipse'
}

group = 'com.dtt.OnBoardingTransactionHandler'
version = '1.0.0'

java {
	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/release' }
}

ext {
	undertowVersion = '2.3.21.Final'
}

dependencies {

	// Encryption
	implementation 'com.github.ulisesbocchio:jasypt-spring-boot-starter:3.0.5'

	// Spring Security (let Spring Boot manage versions)
	implementation 'org.springframework.boot:spring-boot-starter-security'

	// Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// JPA
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// Web without Tomcat
	implementation('org.springframework.boot:spring-boot-starter-web') {
		exclude group: 'org.springframework.boot', module: 'spring-boot-starter-tomcat'
	}

	// Undertow (secured version)
	implementation 'org.springframework.boot:spring-boot-starter-undertow'
	implementation "io.undertow:undertow-core:${undertowVersion}"

	// Apache HTTP Client (use only one version)
	implementation 'org.apache.httpcomponents.client5:httpclient5'

	// Apache HTTP Client 4.x (compatible with your current code)
	implementation 'org.apache.httpcomponents:httpclient:4.5.14'

	// Dev tools
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Testing
	testImplementation('org.springframework.boot:spring-boot-starter-test') {
		exclude group: 'org.junit.vintage', module: 'junit-vintage-engine'
	}

	// Security constraint overrides
	constraints {
		implementation 'ch.qos.logback:logback-core:1.5.25'
		implementation 'ch.qos.logback:logback-classic:1.5.25'
	}
}

configurations {
	all {
		exclude group: "commons-logging", module: "commons-logging"
	}
}